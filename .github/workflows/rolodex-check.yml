# Fast check: a new script must carry the six header keys (name, purpose, inputs, outputs, writes-to, cleanup).
# Also fails when git tracks a path .gitignore excludes (tracked-ignored-check).
# It reads the diff and writes nothing. The full header drafting is `make rolodex-headers WRITE=1`.
name: rolodex check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rolodex-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make rolodex-check BASE=origin/${{ github.base_ref }}
      - run: make tracked-ignored-check
