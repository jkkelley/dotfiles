# The PR gate. It reads, and it refuses. It writes nothing at all.
#
# Version allocation happens at merge, on main, in skill-publish.yml. That is
# what makes registry.json stop being a conflict point between concurrent skill
# pull requests - no branch allocates a number, so no two branches allocate the
# same one. The cost is that a branch now carries only the *intent*, and an
# intent nobody checked is an intent that fails after the merge, in the
# publisher, where the failure looks like nothing happening.
#
# This workflow is where that intent is checked, while there is still a human
# looking at the pull request.
#
#   validate   (skill-pr-intent.yml) the Bump: trailers hold up, every changed skill resolves to a
#              level, no version: or registry.json was hand-edited, and the
#              resolution table is printed so the outcome is readable before the
#              merge button rather than after it
#   detect     which suites this branch has to run
#   test       one runner per changed skill that ships a suite
#   tools      claude/tools/, which has no registry row and cannot appear in a
#              matrix keyed on skill names
#   gate       this workflow's own script, when this workflow changes
#   workflow   make -C claude/workflow test, when the machinery or a skill its
#              suite calls changes
#
# The shell lives in .github/scripts/bump-gate.sh rather than in this file. A
# shell block inside a workflow can only be tested by pushing, and CI has the
# worst iteration loop in this repository; the script is driven against a
# fixture repository by .github/scripts/testing/run-tests.sh, in a container.
#
# runs-on is ubuntu-24.04 and never ubuntu-latest. Rule 15 wants an immutable
# identifier and GitHub does not publish one for runner images, so a dated label
# is as far as the rule reaches here. The images inside each suite are pinned by
# digest already, and that is the part that governs what the tests run against.
name: skill PR gate

# edited is deliberately absent, and lives in skill-pr-intent.yml instead.
#
# What broke: this trigger list carried edited, and the concurrency group below
# cancels in progress, so every rewrite of a pull request description cancelled
# the suites already running for the same commit and restarted them from zero.
# Measured 2026-10-16 UTC over the last 60 gate runs: 26 cancelled, and 11 head
# SHAs ran twice - the second run being a description edit on unchanged code.
# PR 134 ran the gate 19 times on 10 commits in 12 minutes, 16 cancelled.
#
# Why this fix: only the bump intent reads the description. The suites read the
# tree, and the tree does not change on an edit. So the description check moved
# to its own workflow with its own concurrency group, where an edit re-runs the
# one job that reads the text and leaves the suites alone. Rejected: skipping
# the suites by `if:` on an edit, because a skipped run of the same check names
# replaces the earlier verdict on the pull request and would hide a red suite.
#
# What it costs: retargeting a pull request onto main is also an edited event,
# and no longer re-runs the suites here. Push a commit, or close and reopen, to
# run them against the new base. Record: BR-20261016-bottlenecks.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# The gate reads. Nothing below needs more than this, and a token that cannot
# write is a stronger statement than a comment saying it will not.
permissions:
  contents: read

concurrency:
  group: skill-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: what has to run
    runs-on: ubuntu-24.04
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      tools: ${{ steps.detect.outputs.tools }}
      gate: ${{ steps.detect.outputs.gate }}
      workflow: ${{ steps.workflow.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/bump-gate.sh detect --base "$BASE" \
            | tee -a "$GITHUB_OUTPUT"

      # The path list is claude/workflow's own, in tools/ci-select.sh, and is
      # driven by that directory's test_ci_job.sh. Only the git diff is here.
      - id: workflow
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...HEAD" \
            | bash claude/workflow/tools/ci-select.sh \
            | tee -a "$GITHUB_OUTPUT"

  # An empty matrix is a workflow error in Actions, not a skipped job. A
  # docs-only pull request produces [] and is the common case, so this guard is
  # load-bearing rather than defensive - and it is the one thing in this file
  # that cannot be proved anywhere but here.
  test:
    name: ${{ matrix.skill }}
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: podman
        run: bash .github/scripts/require-podman.sh

      # One line per skill, because run-suite works out how a given suite wants
      # to be started. Three of the seven re-exec themselves into Podman; the
      # rest expect to be started inside a container already.
      - run: bash .github/scripts/bump-gate.sh run-suite "claude/skills/${{ matrix.skill }}"

  tools:
    name: claude/tools
    needs: detect
    if: needs.detect.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: podman
        run: bash .github/scripts/require-podman.sh

      - run: bash .github/scripts/bump-gate.sh run-suite claude/tools

  gate:
    name: the gate's own suite
    needs: detect
    if: needs.detect.outputs.gate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: podman
        run: bash .github/scripts/require-podman.sh

      - run: bash .github/scripts/testing/run-tests.sh

  # PR 99 (feat(workflow): herdr-first orchestration) merged with
  # `make -C claude/workflow test` green only on the author's machine. Nothing
  # in this file ran it: detect keys the test matrix on claude/skills/<name>/
  # testing/run-tests.sh, and claude/workflow/ is neither a skill nor
  # claude/tools, so the suite had no row anywhere. A regression in the
  # compaction ceremony, the seat watcher or the model-chain spawner would have
  # merged on a green check that never looked at it.
  #
  # Why a job in this workflow rather than a sibling with on.pull_request.paths:
  # every pull request check lives here behind detect, and a path-filtered
  # workflow that does not trigger leaves a required check pending forever,
  # where a job skipped by `if:` reports as passed.
  #
  # Why the Makefile rather than a run-suite line: the Makefile already builds
  # its own image from a digest-pinned base and runs every target in Podman
  # with --network=none. Calling it is the same command a contributor runs, so
  # CI and the local loop cannot disagree about what "the suite" means.
  workflow:
    name: claude/workflow
    needs: detect
    if: needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: podman
        run: bash .github/scripts/require-podman.sh

      - run: make -C claude/workflow test
