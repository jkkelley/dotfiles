# The bump intent check, split out of skill-pr-gate.yml so a description edit
# re-runs only the job that reads the description.
#
# edited is not padding. The Bump: trailer and the conventional title both live
# in the pull request itself, not in a file, so a verdict reached before someone
# fixed a typo in the description is a verdict about text that no longer exists.
# The default set stops at opened, synchronize and reopened, and would leave a
# green check standing over a description that had since been rewritten.
#
# Why its own file: while this job shared skill-pr-gate.yml's concurrency group,
# every edit cancelled the suites running for the same commit and restarted
# them (26 of the last 60 gate runs cancelled, measured 2026-10-16 UTC). Here an
# edit cancels only an earlier run of this one job. The job name, "bump intent",
# is unchanged, so anything reading that check by name still finds it.
# Record: BR-20261016-bottlenecks.
name: skill PR intent

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skill-pr-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: bump intent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The title and body are written to files rather than interpolated into
      # the shell. A pull request description is attacker-controlled text and
      # ${{ }} pastes it into the script before bash ever sees a quote.
      - name: the pull request description, as the squash commit will carry it
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY"  > "$RUNNER_TEMP/pr-body.txt"

      # WO-20261016-8507. BASE used to be the event's PR base sha.
      # When skill-publish committed a version allocation to main after the
      # branch was cut, that sha was older than the main the merge ref is built
      # on, so the diff showed registry.json and a version: line as edited by
      # the branch and this job failed (PRs 274, 277, 297, 298), clearing only
      # after the author merged main in. The merge base equals the current base
      # on a merge ref, so the publish commit is on both sides and drops out.
      # Rejected: re-running after merging main in - a hand step.
      - name: BASE is the merge base with the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "BASE=$(bash .github/scripts/bump-gate.sh base --ref origin/$BASE_REF)" >> "$GITHUB_ENV"

      - name: resolve every changed skill to a level
        run: |
          set -euo pipefail
          bash .github/scripts/bump-gate.sh resolve \
            --base "$BASE" \
            --title-file "$RUNNER_TEMP/pr-title.txt" \
            --body-file  "$RUNNER_TEMP/pr-body.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # verify --structure is the split that exists for exactly this call site.
      # It asserts every skill is versioned, that every requires: resolves, and
      # that this branch edited neither a version: line nor registry.json -
      # those are CI's files now. Plain verify cannot run here: a branch that
      # edits a skill moves its content hash while correctly leaving the
      # registry alone, and plain verify calls that drift.
      - name: no hand-edited version, no hand-edited registry
        run: |
          set -euo pipefail
          bash claude/skills/skill-registry/scripts/skill-version.sh verify \
            --structure --base "$BASE"
