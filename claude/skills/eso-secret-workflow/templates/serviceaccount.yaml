# serviceaccount.yaml — Base ESO ServiceAccount (no role-arn annotation)
#
# This file goes in homelab-gitops at: apps/{NAMESPACE}/eso/serviceaccount.yaml
#
# The eks.amazonaws.com/role-arn annotation is NOT set here.
# It is injected at sync time by the ApplicationSet's Kustomize patch
# (see applicationset-fragment.yaml). Setting it here would require
# hardcoding the account ID or ARN, which violates the clean data principle.
#
# Replace: NAMESPACE

apiVersion: v1
kind: ServiceAccount
metadata:
  name: NAMESPACE-eso-sa
  namespace: NAMESPACE
  # role-arn annotation is added by ApplicationSet Kustomize patch at sync time.
  # Do not add it here.
