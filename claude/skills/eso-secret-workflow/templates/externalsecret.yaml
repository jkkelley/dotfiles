# externalsecret.yaml — Generic ExternalSecret template
#
# Maps SSM parameters to keys inside a single k8s Secret.
# Use this for standard secrets with no startup ordering requirement.
# Use externalsecret-wave.yaml instead when the consuming resource
# (NATS, Postgres init container, etc.) must have the secret before it starts.
#
# Replace: NAMESPACE, SECRET_GROUP_NAME, KEY_NAME, SSM_PATH_SUFFIX

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: SECRET_GROUP_NAME        # logical name for this group of secrets
  namespace: NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm                # always "aws-ssm" — matches secretstore.yaml
    kind: SecretStore
  target:
    name: SECRET_GROUP_NAME      # name of the k8s Secret ESO creates
    creationPolicy: Owner        # ESO owns lifecycle — do not change
    deletionPolicy: Retain       # k8s Secret survives ExternalSecret deletion
  data:
    # Add one entry per SSM parameter.
    # secretKey: the key name inside the k8s Secret
    # remoteRef.key: full SSM path including namespace prefix
    - secretKey: KEY_NAME
      remoteRef:
        key: /NAMESPACE/SSM_PATH_SUFFIX

    # Additional entries follow the same pattern:
    # - secretKey: ANOTHER_KEY
    #   remoteRef:
    #     key: /NAMESPACE/ANOTHER_PATH
