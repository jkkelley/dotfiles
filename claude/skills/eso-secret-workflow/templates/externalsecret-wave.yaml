# externalsecret-wave.yaml — ExternalSecret with ArgoCD sync-wave: "-1"
#
# Use this when the consuming resource MUST have the secret before it starts.
# Common cases: NATS JWTs, Postgres passwords, init containers.
#
# sync-wave: "-1" ensures ESO resolves and creates the k8s Secret before
# ArgoCD deploys any wave-0 resources (Deployments, StatefulSets, etc.).
#
# Replace: NAMESPACE, SECRET_GROUP_NAME, KEY_NAME, SSM_PATH_SUFFIX

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: SECRET_GROUP_NAME
  namespace: NAMESPACE
  annotations:
    # Wave -1: this ExternalSecret is synced and must reach READY=True
    # before ArgoCD moves on to wave 0 (default) resources.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: SecretStore
  target:
    name: SECRET_GROUP_NAME
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: KEY_NAME
      remoteRef:
        key: /NAMESPACE/SSM_PATH_SUFFIX

    # Additional entries:
    # - secretKey: ANOTHER_KEY
    #   remoteRef:
    #     key: /NAMESPACE/ANOTHER_PATH

---
# Example: NATS JWT decoupling pattern
#
# Stores NATS Operator JWT and Account JWT in SSM.
# ESO delivers them as a k8s Secret mounted into the NATS pod.
# nats.conf uses the 'include' directive to pull them in at startup.
# No JWT ever appears in a ConfigMap or Git.
#
# SSM parameters required:
#   /NAMESPACE/nats-operator-jwt   (SecureString)
#   /NAMESPACE/nats-account-jwt    (SecureString)
#
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: nats-creds
#   namespace: NAMESPACE
#   annotations:
#     argocd.argoproj.io/sync-wave: "-1"
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-ssm
#     kind: SecretStore
#   target:
#     name: nats-creds
#     creationPolicy: Owner
#     deletionPolicy: Retain
#   data:
#     - secretKey: operator.jwt
#       remoteRef:
#         key: /NAMESPACE/nats-operator-jwt
#     - secretKey: account.jwt
#       remoteRef:
#         key: /NAMESPACE/nats-account-jwt
#
# Mount in NATS StatefulSet:
#   volumes:
#     - name: nats-creds
#       secret:
#         secretName: nats-creds
#   volumeMounts:
#     - name: nats-creds
#       mountPath: /etc/nats-creds
#       readOnly: true
#
# In nats.conf ConfigMap (JWTs removed — only structure remains):
#   operator: /etc/nats-creds/operator.jwt
#   resolver {
#     include /etc/nats-creds/account.jwt
#   }
