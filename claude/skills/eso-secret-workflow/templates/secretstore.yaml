# secretstore.yaml — Namespace-scoped SecretStore
#
# One per namespace. Name is always "aws-ssm" — this constant is what
# ExternalSecrets reference via secretStoreRef.name. Never change this name.
#
# The ESO ServiceAccount (NAMESPACE-eso-sa) is granted SSM read access via
# IRSA — the trust policy is scoped to this exact SA + namespace combination.
#
# Replace NAMESPACE and REGION with actual values.

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ssm          # constant — ExternalSecrets always reference "aws-ssm"
  namespace: NAMESPACE
spec:
  provider:
    aws:
      service: ParameterStore
      region: REGION
      auth:
        jwt:
          serviceAccountRef:
            name: NAMESPACE-eso-sa   # must match Terraform var.namespace + "-eso-sa"
