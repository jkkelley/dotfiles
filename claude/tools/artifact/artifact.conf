# artifact.conf - inputs for artifact.sh. Shell KEY=value, sourced.
# Precedence: built-in defaults < this file (or $ARTIFACT_CONF) < ~/.config/zenith/artifact.conf < environment < arguments.
# Every value below is the default, written out so the next reader sees what the script assumes.

# The store root. Kept at the existing Zenith state root (XDG state), which backup/YYYY/MM/ already uses.
ARTIFACT_ROOT="${XDG_STATE_HOME:-$HOME/.local/state}/zenith"

# Keys a seat may write under. An unknown key is refused, so a typo never starts a new tree.
# a2a: agent to agent messages, named by a2a-send (claude/workflow/a2a-guard), brief BR-20261016-a2a-guard P3.
ARTIFACT_KEYS="backup brief result log context screenshot report state trace a2a"

# Tracked paths that belong in the store, as one extended regex. artifact-check fails on any match.
ARTIFACT_CHECK_PATTERNS='\.log$|\.out$|(^|/)nohup\.out$|\.pid$|\.trace$|-result\.json$|(^|/)screenshots?/|(^|/)[0-9]{8}-[0-9]{6}-'

# Tracked paths that match a pattern above but are legitimately source (templates, fixtures).
ARTIFACT_CHECK_ALLOW='templates/'
