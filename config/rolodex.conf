# rolodex.conf - scan roots for scripts/rolodex.py. One "key: value" per line, a repeated key makes a list, ~ allowed.
# Arguments to rolodex.py override these (Design principles 101 item 17).
# Repos: a root that is itself a git repo counts once, otherwise each child directory with a .git.
repo_root: ~/projects
repo_root: ~/dotfiles
bin_dir: ~/.local/bin
state_root: ~/.local/state
state_root: ~/.config/zenith
# Lists of global files outside any repo, relative to this repo.
global_list: config/md-contents-global.list
global_list: config/golden-rules.global
# Curated writer and cleanup rows for folders no script header names yet.
owners: config/rolodex-owners.tsv
# Windows profile folders used by the browser seats (Windows Claude Code with Chrome).
win_root: /mnt/c/Users/jkkel
win_dir: inbox-triage-*
win_dir: claude-chrome-profile
win_dir: chrome-profiles
win_dir: .claude
# Where `headers` drafts headers by default. claude/skills is left out: a skill edit carries a version bump (CLAUDE.md Rule 16).
header_root: scripts
header_root: tools
header_root: claude/tools
header_root: .github/scripts
header_root: workflows
# dotfiles is public (CLAUDE.md PII policy), so these patterns become <private> in the committed output.
# Owner, 2026-10-16 UTC: YieldPoint is never tied to the owner's name. --no-redact keeps them, for output that stays out of git.
redact: yieldpoint[\w-]*
redact: ypli[\w-]*
redact: yp-[\w-]*
redact: tmp-yieldpoint
redact: jkkel\w*
redact: luna
